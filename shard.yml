name: termbuf
version: 0.2.1

authors:
  - Paul M. Lambert <plambert@plambert.net>

crystal: '>= 1.21'

license: MIT

description: |
  A terminal screen held in memory, repainted with a diff. Decouples a terminal
  application's UI from the terminal itself: draw into a buffer, ask for a
  paint, and only the difference goes out, encoded against what that particular
  terminal turned out to be able to do.

# The input side: bytes and signals from a terminal turned into events. It was
# part of this shard and is now its own, because reading a keyboard is useful
# without a screen buffer attached. Nothing else outside the standard library
# is needed.
dependencies:
  termbuf-input:
    github: plambert/termbuf-input.cr
    version: "~> 0.1"

development_dependencies:
  spectator:
    gitlab: arctic-fox/spectator
    version: "~> 0.11"
  guard:
    github: plambert/guard.cr
